repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/PyCQA/pyflakes
    rev: 3.2.0
    hooks:
      - id: pyflakes
        args: [rag/src/, agent_core/]

  - repo: https://github.com/PyCQA/pycodestyle
    rev: 2.12.1
    hooks:
      - id: pycodestyle
        args: [--max-line-length=120, --ignore=E402,W503]
        files: ^(rag/src/|agent_core/)

  - repo: local
    hooks:
      - id: python-syntax
        name: python syntax check
        entry: python -c "import ast, sys; ast.parse(sys.stdin.read())"
        language: system
        files: \.py$
